<ion-header [translucent]="true">
  <ion-toolbar>
    <div class="w-full flex flex-row">
      <ion-back-button defaultHref="/tabs/profile"></ion-back-button>
      <ion-title>{{ 'profile.password-confirmation' | translate }}</ion-title>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-card class="rounded-2xl mt-10">
    <ion-card-header>
      <ion-card-title class="text-center">{{ 'profile.confirm-password' | translate }}</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <form [formGroup]="passwordForm" (ngSubmit)="submit()">
        <ion-input label="{{ 'profile.password' | translate }}" formControlName="password">
          <ion-input-password-toggle slot="end"></ion-input-password-toggle>
        </ion-input>
        @if (errorMessage) {
          <ion-text color="danger" class="text-center block mt-2">{{ errorMessage }}</ion-text>
        }
        <ion-button class="w-full pt-2" [disabled]="!passwordForm.valid" type="submit">{{ 'profile.continue' | translate }}</ion-button>
      </form>
    </ion-card-content>
  </ion-card>
</ion-content>
