<ion-header [translucent]="true">
  <ion-toolbar>
    <div class="w-full flex flex-row">
      <ion-back-button defaultHref="/tabs/profile"></ion-back-button>
      <ion-title>{{ 'profile.select-language' | translate }}</ion-title>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-radio-group [value]="translateService.getCurrentLang()" (ionChange)="switchLanguage($event.detail.value)">
    <ion-item>
      <ion-radio value="en">{{ 'profile.english' | translate }}</ion-radio>
    </ion-item>
    <ion-item>
      <ion-radio value="al">{{ 'profile.albanian' | translate }}</ion-radio>
    </ion-item>
  </ion-radio-group>
</ion-content>
