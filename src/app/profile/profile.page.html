<ion-header [translucent]="true">
  <app-navbar title="{{ 'profile.title' | translate }}"></app-navbar>
</ion-header>

<ion-content [fullscreen]="true">

  <div class="flex justify-between w-full items-center gap-3 ion-padding">
    <ion-avatar class="w-1/3 h-24">
      <img alt="Profile Picture" [src]="profilePicture" />
    </ion-avatar>
    <div class="flex flex-col w-2/3 gap-1">
      <ion-label>
        {{user.firstname}} {{user.lastname}}
      </ion-label>
      <ion-label>
        {{user.email}}
      </ion-label>
      <ion-button color="primary" (click)="navigateTo('details')">
        {{ 'profile.view-profile' | translate }}
      </ion-button>
    </div>
  </div>

  <div class="mt-4">
    <ion-list lines="full" class="no-last-line">
      @for (item of listItems; track item.title; let last = $last) {
        <ion-item>
          @if (last) {
            <ion-label color="danger" (click)="navigateTo(item.goTo)">{{ item.title | translate }}</ion-label>
          } @else {
            <ion-label>{{ item.title | translate }}</ion-label>
            <ion-button fill="clear" (click)="navigateTo(item.goTo, item.queryParams)" slot="end">
              <ion-icon name="arrow-forward-outline" slot="icon-only"></ion-icon>
            </ion-button>
          }
        </ion-item>
      }
    </ion-list>
  </div>
</ion-content>
